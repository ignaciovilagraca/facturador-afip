[project]
name = "facturador-afip"
version = "0.1.0"
description = "Facturas electrónicas de ARCA (ex AFIP) desde Python: A, B, C, notas de crédito y Factura E, con el PDF de Comprobantes en línea"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ignacio Vila Graca" }]
requires-python = ">=3.11"
keywords = ["arca", "afip", "factura electronica", "argentina", "wsfe", "wsfex"]
dependencies = [
    "cryptography>=42",
    "reportlab>=4",
    "qrcode>=7",
    "pillow>=10",
]

[project.urls]
Repository = "https://github.com/ignaciovilagraca/facturador-afip"
Issues = "https://github.com/ignaciovilagraca/facturador-afip/issues"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
